<!doctype html><html><head><meta charset="utf-8">
<!-- The GitHub social preview (brand/marketing/social-preview-1280.png): open at 1280x640, 2x, and screenshot. The shot is a running app opened by npx uisandbox-mcp open, six ways (decision 227). -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1280px;height:640px;overflow:hidden;background:#f4f4f5;font-family:Inter,sans-serif;color:#18191d;position:relative}
.left{position:absolute;left:64px;top:0;bottom:0;width:470px;display:flex;flex-direction:column;justify-content:center;gap:26px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:26px;letter-spacing:-.01em}
.brand svg{width:40px;height:40px}
h1{font-size:50px;line-height:1.06;font-weight:700;letter-spacing:-.03em}
.cmd{display:inline-flex;align-items:center;gap:12px;background:#18191d;color:#fff;border-radius:12px;padding:16px 20px;font:500 19px 'JetBrains Mono',monospace;width:max-content}
.cmd span{color:#8b8d98}
p{font-size:19px;line-height:1.45;color:#52535c}
.shot{position:absolute;left:575px;top:58px;width:900px;border-radius:16px;overflow:hidden;box-shadow:0 30px 70px rgba(24,25,29,.18),0 0 0 1px rgba(24,25,29,.08)}
.shot img{display:block;width:100%}
</style></head><body>
<div class="left">
  <div class="brand"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#18191D"/><path d="M12 32H32V40H12V52H52V32H32V24H52V12H12V32Z" fill="#fff"/></svg>UISandbox</div>
  <h1>Try designs on the app you are running.</h1>
  <div class="cmd"><span>$</span>npx uisandbox-mcp@latest open</div>
  <p>Your own screen six ways, every knob on its own values, then a patch your agent applies. Free and open source.</p>
</div>
<div class="shot"><img src="../../brand/marketing/local-app-six-1440.png"></div>
</body></html>
