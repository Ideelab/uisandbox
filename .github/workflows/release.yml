# A GitHub Release for every MCP version: when mcp/package.json's version
# changes on main and no tag vX.Y.Z exists yet, tag it and publish a release
# with generated notes. npm publish stays a human step (it needs 2FA);
# the release follows the version on its own.
#
# And the MCP registry, by the workflow's own GitHub OIDC login: the registry
# grants io.github.Ideelab/* to a workflow in an Ideelab repo, with no token.
# A browser login never carries read:org, so the registry fell back to the
# personal namespace and refused the org one (decisions 177, 178). It runs
# once npm has the version (the registry checks the package), and skips a
# version the registry already has. After an npm publish, run it by hand:
# Actions, release, Run workflow.
name: release
on:
  push:
    branches: [main]
    paths: [mcp/package.json]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: v
        run: |
          V=$(node -p "require('./mcp/package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.v.outputs.exists == 'false'
        env: { GH_TOKEN: "${{ github.token }}", V: "${{ steps.v.outputs.version }}" }
        run: |
          git tag "v$V" && git push origin "v$V"
          gh release create "v$V" --title "v$V" --generate-notes \
            --notes "**UISandbox $V**: [uisandbox.org](https://uisandbox.org) · npm \`uisandbox-mcp@$V\` (\`npx -y uisandbox-mcp\`) · on the [MCP registry](https://registry.modelcontextprotocol.io/v0/servers?search=uisandbox). Play with your app's design, right in the browser: bring your app, pick a look, tune it, take it home."

  registry:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # the registry's GitHub OIDC login
      contents: read
    defaults:
      run: { working-directory: mcp }
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./server.json').name")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          npm view "uisandbox-mcp@$V" version >/dev/null 2>&1 && echo "npm=true" >> "$GITHUB_OUTPUT" || echo "npm=false" >> "$GITHUB_OUTPUT"
          # the server's own version list: the search pages, and showed 0.5.0 after 0.5.1 was in
          curl -s "https://registry.modelcontextprotocol.io/v0/servers/${N/\//%2F}/versions" | grep -q "\"version\":\"$V\"" && echo "listed=true" >> "$GITHUB_OUTPUT" || echo "listed=false" >> "$GITHUB_OUTPUT"
      - if: steps.v.outputs.npm == 'false'
        run: echo "::notice::uisandbox-mcp@${{ steps.v.outputs.version }} is not on npm yet. Publish it, then run this workflow by hand."
      - if: steps.v.outputs.npm == 'true' && steps.v.outputs.listed == 'false'
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
